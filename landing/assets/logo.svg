<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nebula">
  <defs>
    <radialGradient id="nebulaCore" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="90%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="nebulaRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="nebulaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#nebulaGlow)">
    <!-- Ambient Cosmic Aura -->
    <circle cx="32" cy="32" r="18" fill="#6d28d9" opacity="0.32" />

    <!-- 1. Complete Continuous Orbital Ring (back half visible, outer tips seamless) -->
    <ellipse cx="32" cy="32" rx="27" ry="9" fill="none" stroke="url(#nebulaRing)" stroke-width="2.6" transform="rotate(-24 32 32)" opacity="0.92" />

    <!-- 2. Celestial Sphere Orb Core (centered at 32, 32) -->
    <circle cx="32" cy="32" r="15" fill="url(#nebulaCore)"/>
    <circle cx="32" cy="32" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.36" stroke-width="0.8"/>

    <!-- 3. Foreground Orbital Ring Arc (passes over front of sphere, seamless depth) -->
    <g transform="rotate(-24 32 32)">
      <path d="M 56.5 35.8 A 27 9 0 0 1 7.5 35.8" fill="none" stroke="url(#nebulaRing)" stroke-width="2.6" stroke-linecap="round" opacity="0.98" />
    </g>
  </g>
</svg>
