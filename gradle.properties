org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release signing is supplied at build time and must never be committed.
# Provide these through Gradle properties outside the repository
# (e.g. ~/.gradle/gradle.properties), environment variables, or
# -P flags on the command line:
#
#   NEBULA_RELEASE_STORE_FILE=<path-to-keystore>
#   NEBULA_RELEASE_STORE_PASSWORD=<configure-securely>
#   NEBULA_RELEASE_KEY_ALIAS=<key-alias>
#   NEBULA_RELEASE_KEY_PASSWORD=<configure-securely>
#
# app/build.gradle.kts fails the release build when they are absent.
